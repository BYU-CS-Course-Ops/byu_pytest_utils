name: byu_pytest_utils Publish

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  publish:
    uses: BYU-CS-Course-Ops/utils/.github/workflows/publish.yaml@main
    with:
      pypi_package: "byu_pytest_utils"
      publisher: "poetry"
      project_name: "byu_pytest_utils"
    secrets:
      pypi_token: ${{ secrets.PYPI_TOKEN }}
      discord_webhook_url: ${{ secrets.GHA_DISCORD_WEBHOOK }}
      discord_role: ${{ secrets.CICD_NOTIFY_DISCORD_ROLE }}
